name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.21", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -short -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go mod tidy
        run: go mod tidy -diff

  race-and-32bit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -short -race -count=1 -run 'Writer|Reader|Determin|Cancel|Pipeline|Walk|Progress' .
      - name: 32-bit build and tests
        run: GOARCH=386 go test -short -count=1 .

  interop:
    name: interop with reference zpaq
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: sudo apt-get update && sudo apt-get install -y zpaq
      - run: zpaq 2>&1 | head -1
      - name: Interoperability tests (fail if skipped)
        run: |
          go test -count=1 -v -run 'TestInterop' . | tee interop.log
          ! grep -q 'reference zpaq not found' interop.log
          grep -q -- '^--- PASS: TestInteropZpaqExtractsOurArchives ' interop.log
          grep -q -- '^--- PASS: TestInteropWeDecodeZpaqArchives ' interop.log
